name: State and discovery isolation

on:
  pull_request:
    branches:
      - testing
  push:
    branches:
      - testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: State volume, advertisement identity and launcher behaviour
        run: python3 -m unittest discover -s tests -v

      - name: Lint the launcher scripts
        run: shellcheck scripts/*.sh
