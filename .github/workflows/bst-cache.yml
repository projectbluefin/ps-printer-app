name: BuildStream cache refill

on:
  push:
    branches: [testing]
    paths:
      - project.conf
      - elements/**
      - include/**
      - patches/**
      - files/**
      - Makefile
      - ps-printer-app.c
      - ps-printer-app.1
      - ps-printer-app.service
      - generic-ps-printer.ppd
      - testpage.ps
      - VERSION
      - ci/buildstream.conf
      - .github/workflows/bst-cache.yml
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prerequisites:
    name: Check FSDK integration prerequisites
    runs-on: ubuntu-26.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for the FSDK graph
        id: check
        shell: bash
        run: |
          # Bootstrap only: issues #2-#5 supply the graph and real test harness.
          # A partial graph must fail rather than silently skip validation.
          if [[ ! -e project.conf && ! -d elements && ! -e Justfile && ! -e justfile ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::FSDK image validation is pending prerequisites #2-#5.'
            echo 'FSDK image jobs skipped: issues #2-#5 have not supplied the build graph and socket-sink harness. This is not image validation evidence.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -f project.conf
          test -f elements/oci/ps-printer-app.bst
          test -f Justfile || test -f justfile
          test -x tests/core-appliance.sh
          test -x tests/core-payload.sh
          echo 'available=true' >> "$GITHUB_OUTPUT"

  refill:
    name: Refill (${{ matrix.arch }})
    needs: prerequisites
    if: needs.prerequisites.outputs.available == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    # Never cancel: a running refill must reach its save step. A burst of
    # pushes collapses to one running plus one pending refill per arch.
    concurrency:
      group: bst-cache-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman
      - name: Compute BuildStream cache key
        id: bst-key
        env:
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'ps-printer-app.c', 'ps-printer-app.1', 'ps-printer-app.service', 'generic-ps-printer.ppd', 'testpage.ps', 'VERSION') }}
        run: echo "hash=${INPUTS_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore BuildStream cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: bst-v1-${{ matrix.arch }}-${{ steps.bst-key.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            bst-v1-${{ matrix.arch }}-${{ steps.bst-key.outputs.hash }}-
            bst-v1-${{ matrix.arch }}-
      - name: Build image
        run: just bst --config /src/ci/buildstream.conf --network-retries 5 build oci/ps-printer-app.bst
      - name: Report cache size
        run: |
          {
            echo '### BuildStream cache (${{ matrix.arch }})'
            echo '```'
            du -sh ~/.cache/buildstream/cas ~/.cache/buildstream/artifacts ~/.cache/buildstream/source_protos
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save BuildStream cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: bst-v1-${{ matrix.arch }}-${{ steps.bst-key.outputs.hash }}-${{ github.run_id }}
      - name: Prune older BuildStream caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: bst-v1-${{ matrix.arch }}-
          KEEP: bst-v1-${{ matrix.arch }}-${{ steps.bst-key.outputs.hash }}-${{ github.run_id }}
        run: |
          gh cache list --key "$PREFIX" --ref "$GITHUB_REF" --limit 100 --json id,key \
            --jq '.[] | select(.key != env.KEEP) | .id' |
            while read -r id; do
              gh cache delete "$id"
            done
