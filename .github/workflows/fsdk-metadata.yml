name: FSDK metadata consistency

# FSDK is reached only through the fsdk-containers junction, and the image
# states that nested pin in the hand-written io.projectbluefin.fsdk.* labels of
# elements/oci/ps-printer-app.bst. A junction bump (update-base.yml opens one
# daily) moves FSDK without touching those labels, and `just validate` does not
# compare them. Promotion refuses that state; this finds it on the pull request.
#
# It reads files, fetches the pinned fsdk-containers commit and runs unit tests.
# It builds nothing and holds no credentials.

on:
  pull_request:
    branches:
      - testing
  push:
    branches:
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsdk-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Check the FSDK pin
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise the checker against mismatched metadata fixtures
        run: python3 -m unittest discover -s tests -p 'test_fsdk_metadata*.py' -v

      - name: Compare the nested FSDK pin with the OCI element labels
        run: python3 scripts/verify-fsdk-metadata.py
