name: USB quirk state

on:
  pull_request:
    branches:
      - testing
  push:
    branches:
      - testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Seed and restart behaviour
        run: python3 -m unittest discover -s tests -v

      - name: Lint the launcher scripts
        run: shellcheck scripts/seed-usb-quirks.sh scripts/start-server.sh scripts/run-avahi.sh
