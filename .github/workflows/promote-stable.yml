name: Promote verified PostScript testing commit to stable

on:
  workflow_dispatch:
    inputs:
      testing_sha:
        description: Exact testing commit to rebuild and promote
        required: true
        type: string

permissions: {}
concurrency:
  group: ps-stable-promotion
  cancel-in-progress: false

jobs:
  # FSDK is pinned through the fsdk-containers junction, and the image states
  # that pin in hand-written io.projectbluefin.fsdk.* labels; moving the junction
  # can leave them behind. Refuse that before spending a build on it.
  metadata:
    name: Reject mismatched FSDK metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.testing_sha }}
          persist-credentials: false
      - name: Compare the nested FSDK pin with the OCI element labels
        run: python3 scripts/verify-fsdk-metadata.py

  verify:
    name: Verify OCI image (${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.testing_sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman
      - name: Build real OCI printer image
        run: just build
      - name: Compare the nested FSDK pin with the built image labels
        run: python3 scripts/verify-fsdk-metadata.py --image ghcr.io/projectbluefin/ps-printer-app:build
      - name: Verify real OCI printer image
        run: just verify

  promote:
    needs: [metadata, verify]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.testing_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fast-forward stable only from verified testing HEAD
        env:
          CANDIDATE: ${{ inputs.testing_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE" ]]
          git fetch origin testing stable
          [[ "$(git rev-parse origin/testing)" == "$CANDIDATE" ]]
          git merge-base --is-ancestor origin/stable "$CANDIDATE"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push origin "$CANDIDATE:refs/heads/stable"
